name: Waka Readme

on:
  schedule:
    - cron: "15 18 * * *" # 02:15 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme-update
  cancel-in-progress: false

jobs:
  update-readme:
    name: Update WakaTime metrics
    runs-on: ubuntu-latest
    steps:
      - name: Update README with WakaTime metrics
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SECTION_NAME: waka
          COMMIT_MESSAGE: "chore: update WakaTime metrics"
          SHOW_TOTAL_CODE_TIME: "True"
          SHOW_AI_CODE_TIME: "True"
          SHOW_AI_CODING: "True"
          SHOW_LANGUAGE: "True"
          SHOW_EDITORS: "True"
          SHOW_OS: "True"
          SHOW_PROJECTS: "False"
          SHOW_TIMEZONE: "False"
          SHOW_COMMIT: "False"
          SHOW_DAYS_OF_WEEK: "False"
          SHOW_LANGUAGE_PER_REPO: "False"
          SHOW_LOC_CHART: "False"
          SHOW_SHORT_INFO: "False"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_LINES_OF_CODE: "False"
          SHOW_UPDATED_DATE: "True"
          UPDATED_DATE_FORMAT: "%Y-%m-%d %H:%M"
          BADGE_STYLE: "flat"
