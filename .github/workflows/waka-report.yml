name: WakaTime Report

on:
  schedule:
    - cron: "45 18 * * *" # 02:45 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme-update
  cancel-in-progress: false

jobs:
  update-report:
    name: Refresh WakaTime report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate README summary and WakaTime report
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python scripts/waka_report.py

      - name: Commit README and report
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md WAKATIME.md
          if git diff --cached --quiet; then
            echo "No README changes"
          else
            git commit -m "chore: refresh WakaTime report"
            git pull --rebase
            git push
          fi
